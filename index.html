
<!DOCTYPE html>
<html>
<head>
  <title>My Shop</title>
</head>
<body>

<h2>Add Product</h2>

<input type="text" id="title" placeholder="Title"><br><br>
<textarea id="description" placeholder="Description"></textarea><br><br>
<input type="text" id="price" placeholder="Price"><br><br>
<input type="file" id="image"><br><br>
<button onclick="addProduct()">Add Product</button>

<hr>
<h2>Products</h2>
<div id="products"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, addDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyBkmC7tSCKjjA-1z9NbTklQkNVGaNeYBY0",
  authDomain: "prapika-131fc.firebaseapp.com",
  projectId: "prapika-131fc",
  storageBucket: "prapika-131fc.firebasestorage.app",
  messagingSenderId: "75116240330",
  appId: "1:75116240330:web:5825d9240e9f7dd5638333"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

window.addProduct = async function(){

  const title = document.getElementById("title").value;
  const description = document.getElementById("description").value;
  const price = document.getElementById("price").value;
  const file = document.getElementById("image").files[0];

  if(!file){
    alert("Please select image");
    return;
  }

  const storageRef = ref(storage, "products/" + Date.now() + file.name);
  await uploadBytes(storageRef, file);
  const imageURL = await getDownloadURL(storageRef);

  await addDoc(collection(db, "products"), {
    title,
    description,
    price,
    image: imageURL
  });

  alert("Product Added Successfully!");
  location.reload();
}

async function loadProducts(){
  const querySnapshot = await getDocs(collection(db, "products"));
  const container = document.getElementById("products");

  querySnapshot.forEach((doc) => {
    const data = doc.data();
    container.innerHTML += `
      <div style="border:1px solid #ccc; padding:10px; margin:10px;">
        <img src="${data.image}" width="150"><br>
        <h3>${data.title}</h3>
        <p>${data.description}</p>
        <strong>₹${data.price}</strong>
      </div>
    `;
  });
}

loadProducts();

</script>

</body>
</html>
