<!DOCTYPE html>
<html>
<head>
  <title>My Shop</title>
</head>
<body>

<h2>My Products</h2>
<div id="products"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabaseUrl = 'https://bzrtatocdlyeyttomgdu.supabase.co'
const supabaseKey = 'sb_publishable_sBtkBG9vQ82_cyG3ML40XQ_eR7lB3UI'

const supabase = createClient(supabaseUrl, supabaseKey)

async function loadProducts() {

  const { data, error } = await supabase
    .from('products')
    .select('*')
    .order('id', { ascending: false })

  if (error) {
    console.log("Error:", error)
    return
  }

  const container = document.getElementById("products")
  container.innerHTML = ""

  data.forEach(p => {
    container.innerHTML += `
      <div style="border:1px solid #ddd; padding:15px; margin:15px; border-radius:10px;">
        <img src="${p.image}" width="200"><br><br>
        <h3>${p.title}</h3>
        <p>${p.description}</p>
        <strong style="color:green;">₹${p.price}</strong>
      </div>
    `
  })
}

loadProducts()
</script>

</body>
</html>
